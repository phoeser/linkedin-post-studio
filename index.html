const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err'),
        btn=document.getElementById('go');
  if(!pw){err.textContent='Bitte Passwort eingeben';return}
  btn.disabled=true; btn.textContent='Entschl\u00fcssele\u2026'; err.textContent='';
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64d(VAULT.salt),iterations:VAULT.it,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(VAULT.iv)},key,b64d(VAULT.ct));
    const stream=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent='Passwort stimmt nicht';
    btn.disabled=false; btn.textContent='\u00d6ffnen';
  }
}
document.getElementById('go').onclick=unlock;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
