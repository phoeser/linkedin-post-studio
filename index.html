<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f4f2ee;color:#1b1b1b;font-size:15px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 .box{background:#fff;border:1px solid #e0dfdc;border-radius:10px;padding:26px 24px;width:340px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
 .logo{display:block;border-radius:13px;margin:0 0 13px}
 h1{margin:0;font-size:19px;letter-spacing:-.01em}
 h1 .li{color:#0a66c2}
 .tag{display:inline-block;margin:7px 0 12px;font-size:11px;font-weight:600;color:#0a66c2;
  background:#eaf3fc;border:1px solid #cfe2f6;border-radius:999px;padding:2px 9px}
 p{margin:0 0 16px;font-size:13px;color:#5f5f5f;line-height:1.5}
 label{display:block;font-size:12px;color:#5f5f5f;margin:0 0 4px}
 input{width:100%;padding:10px 11px;border:1px solid #e0dfdc;border-radius:6px;font-size:15px;
  font-family:inherit;background:#fff;color:#1b1b1b;box-sizing:border-box;margin-bottom:10px}
 button{margin-top:4px;width:100%;padding:10px;border:0;border-radius:6px;background:#0a66c2;
  color:#fff;font-size:15px;font-family:inherit;cursor:pointer}
 button:disabled{opacity:.6;cursor:default}
 .err{margin-top:10px;font-size:13px;color:#bf1528;min-height:18px}
 .fuss{margin-top:14px;padding-top:13px;border-top:1px solid #eeedea;font-size:12.5px}
 .fuss a{color:#5f5f5f;text-decoration:none}
 .fuss a:hover{color:#0a66c2;text-decoration:underline}

      km,{name:'AES-GCM',length:256},false,['decrypt']);

    const ktx=JSON.parse(new TextDecoder().decode(roh));
    const ak=await crypto.subtle.importKey('raw',b64d(ktx.appKey),{name:'AES-GCM'},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(APP.iv)},ak,b64d(APP.ct));
    const stream=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    delete ktx.appKey;                       /* der App-Schluessel geht nicht weiter */
    document.open();
    /* Kleiner-Zeichen maskieren: ein Rollentext, der ein schliessendes
       Skript-Tag enthaelt, wuerde den Block sonst vorzeitig beenden. */
    const ktxJs=JSON.stringify(ktx).replace(/</g,'\u003c');
    document.write('<scr'+'ipt>window.KONTEXT='+ktxJs+'<\/scr'+'ipt>'+html);
    document.close();
  }catch(e){
    err.textContent='Name oder Passwort stimmt nicht';
    btn.disabled=false; btn.textContent='\u00d6ffnen';
  }
}
